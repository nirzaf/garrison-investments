<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Service temporarily unavailable</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #17202a;
        background: #f7faf8;
      }

      main {
        max-width: 560px;
        padding: 32px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #4b5b52;
        font-size: 16px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Service temporarily unavailable</h1>
      <p>
        The construction portal is temporarily unavailable while the technical team restores
        service. Please retry shortly. If urgent site reporting is blocked, contact the Operation
        Manager.
      </p>
    </main>
  </body>
</html>
