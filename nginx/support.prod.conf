# Load this file only through the approved production host override.
server {
    access_log /var/log/nginx/access.log portal_access;
    listen 443 ssl;
    http2 on;
    server_name superadmin.garrisons.lk;

    ssl_certificate /etc/nginx/ssl/support-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/support-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($ssl_server_name != superadmin.garrisons.lk) { return 404; }
    if ($host != superadmin.garrisons.lk) { return 404; }

    # The protected file contains only approved direct source IPs or CIDRs.
    include /etc/nginx/ssl/support-allowlist.conf;
    deny all;

    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; worker-src 'none';" always;

    root /usr/share/nginx/html;
    location = / { try_files /index.html =404; }
    location ^~ /assets/ { try_files $uri =404; }
    location ^~ /brand/ { try_files $uri =404; }

    location = /api/v1/support { return 404; }
    location ^~ /api/v1/support/ {
        limit_req zone=api burst=30 nodelay;
        client_max_body_size 64k;
        proxy_pass http://backend-proxy:8000/api/v1/support/;
        proxy_http_version 1.1;
        proxy_set_header Host superadmin.garrisons.lk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_set_header Authorization "";
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Session-ID "";
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    location / { return 404; }
}
