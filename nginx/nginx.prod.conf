limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# Signed download query parameters must stay out of access logs.
log_format portal_access '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

map $uri $portal_frame_options {
    default DENY;
    ~^/portal-files/ SAMEORIGIN;
}

map $uri $portal_frame_ancestors {
    default "'none'";
    ~^/portal-files/ "'self'";
}

server {
    access_log /var/log/nginx/access.log portal_access;
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    access_log /var/log/nginx/access.log portal_access;
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options $portal_frame_options always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self'; frame-ancestors $portal_frame_ancestors;" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Support traffic requires a separate reviewed virtual host. This
    # catch-all must never expose the draft API or serve business pages as it.
    if ($host = superadmin.garrisons.lk) { return 404; }
    location ~ ^/api/v1/(super-admin|support)(/|$) { return 404; }

    location ~ ^/api/v1/(reports/[^/]+/pdf|export/(project-progress|material-usage|management-summary))$ {
        limit_req zone=api burst=30 nodelay;
        client_max_body_size 60M;
        proxy_pass http://backend-proxy:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Session-ID "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location ~ ^/api/v1/(photos/upload|documents(/[^/]+/versions)?|hr/documents(/[^/]+/versions)?)$ {
        limit_req zone=api burst=30 nodelay;
        client_max_body_size 65M;
        proxy_pass http://backend-proxy:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Session-ID "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/v1/(finance/invoices/[^/]+/attachment|suppliers/[^/]+/tds-document)$ {
        limit_req zone=api burst=30 nodelay;
        client_max_body_size 32M;
        proxy_pass http://backend-proxy:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Session-ID "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        client_max_body_size 60M;
        proxy_pass http://backend-proxy:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Session-ID "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://backend-proxy:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Session-ID "";
    }

    location ^~ /portal-files/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        # Presigned URLs sign the exact Host the client used. $host drops a
        # non-default port, so MINIO_PUBLIC_ENDPOINT=host:port would 403 with
        # SignatureDoesNotMatch. $http_host preserves it verbatim.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
