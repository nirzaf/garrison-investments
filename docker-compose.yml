x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    logging: *default-logging

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://garrison:garrison_dev_password@postgres:5432/garrison_portal}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-false}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Qatar}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - minio
    logging: *default-logging

  celery_worker:
    build:
      context: ./backend
    command: celery -A app.tasks.celery_app.celery_app worker -Q email,image,report,backup,maintenance --loglevel=INFO
    env_file:
      - .env
    environment:
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Qatar}
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
      - postgres
    logging: *default-logging

  celery_beat:
    build:
      context: ./backend
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=INFO
    env_file:
      - .env
    environment:
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Qatar}
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Qatar}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    logging: *default-logging

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-garrison_portal}
      POSTGRES_USER: ${POSTGRES_USER:-garrison}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garrison_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ${OBJECT_STORAGE_IMAGE:-pgsty/silo:RELEASE.2026-11-09T00-00-00Z@sha256:08ce1505b5eacefbad1ca07159b242b9ce045a11c2817e3bc257b25f77bbc02d}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-garrison_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-garrison_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
  frontend_node_modules:
