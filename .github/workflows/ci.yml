name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: garrison-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static:
    name: Backend lint and types
    runs-on: [self-hosted, linux, x64, garrison-ci]
    timeout-minutes: 30
    env:
      PIP_CACHE_DIR: /runner/state/pip-cache
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          # The self-hosted runner keeps this pip cache between jobs.
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy .
      - name: OpenAPI contract is current
        run: python scripts/export_openapi.py --check

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: [self-hosted, linux, x64, garrison-ci]
    timeout-minutes: 30
    env:
      npm_config_cache: /runner/state/npm-cache
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Generated API types are current
        run: npm run api:types:check
      - name: Vitest
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/frontend.xml"
      - name: Build
        run: npm run build
      - name: Upload Vitest report
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.run_attempt }}-frontend
          path: ${{ runner.temp }}/frontend.xml
          if-no-files-found: error

  compose-validate:
    name: Compose files are valid
    runs-on: [self-hosted, linux, x64, garrison-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare example production environment file
        run: cp .env.example .env
      - name: Validate production compose file
        run: docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet
      - name: Start object storage and initialize the Loki bucket
        run: docker compose --project-name garrison-ci-compose --env-file .env.example -f docker-compose.prod.yml run --rm loki_minio_init
      - name: Clean up Compose fixtures
        if: always() && hashFiles('.env.example') != ''
        run: docker compose --project-name garrison-ci-compose --env-file .env.example -f docker-compose.prod.yml down --volumes

  integration-tests:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, linux, x64, garrison-ci]
    timeout-minutes: 30
    env:
      PIP_CACHE_DIR: /runner/state/pip-cache
      npm_config_cache: /runner/state/npm-cache
      CI_TEST_S3_CONTAINER: garrison-ci-s3-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}-${{ matrix.shard }}
    strategy:
      fail-fast: false
      # Keep two independent test shards active on the isolated runner pool.
      max-parallel: 2
      matrix:
        include:
          - suite: backend
            shard: 1
            name: Backend tests (1/2)
            database: garrison_portal
          - suite: backend
            shard: 2
            name: Backend tests (2/2)
            database: garrison_portal
          - suite: browser
            shard: 1
            name: Browser regressions (1/2)
            database: garrison_browser_test
          - suite: browser
            shard: 2
            name: Browser regressions (2/2)
            database: garrison_browser_test
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:19.0-alpine3.24@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
        env:
          POSTGRES_USER: garrison
          POSTGRES_PASSWORD: garrison_dev_password
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U garrison -d ${{ matrix.database }}"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        if: matrix.suite == 'browser'
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Prepare test dependencies and storage
        shell: bash
        env:
          TEST_SUITE: ${{ matrix.suite }}
          CI_TEST_SHARD: ${{ matrix.shard }}
          TEST_S3_IMAGE: motoserver/moto:5.2.2@sha256:d8ae5edc2bf080e7e4c13f9bd4b29b53ac3b4427e92956318db3dbe23ec43eb7
          MIGRATION_DATABASE_URL: postgresql+asyncpg://garrison:garrison_dev_password@127.0.0.1:5432/${{ matrix.database }}
          BUSINESS_TIMEZONE: Asia/Qatar
        run: |
          set -euo pipefail

          (
            pip install -r requirements.txt
            # Both suites require an explicitly migrated database.
            APP_ENV=test DATABASE_URL="$MIGRATION_DATABASE_URL" alembic upgrade head
          ) &
          backend_pid=$!

          (
            # Retry the pinned image pull without retrying container creation.
            if ! docker image inspect "$TEST_S3_IMAGE" >/dev/null 2>&1; then
              for attempt in 1 2 3; do
                if timeout 40s docker pull "$TEST_S3_IMAGE" >/dev/null; then
                  break
                fi
                if [[ "$attempt" == 3 ]]; then
                  exit 1
                fi
                sleep "$attempt"
              done
            fi
            docker run --pull never --detach --name "$CI_TEST_S3_CONTAINER" \
              --publish 127.0.0.1:9000:5000 "$TEST_S3_IMAGE" >/dev/null
            # Keep startup transient errors quiet, then print container diagnostics once.
            ready=0
            deadline=$((SECONDS + 30))
            while (( SECONDS < deadline )); do
              if curl --fail --silent --max-time 2 http://127.0.0.1:9000/ -o /dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if (( ! ready )); then
              echo "The isolated Moto endpoint did not become ready within 30 seconds."
              docker logs --tail 50 "$CI_TEST_S3_CONTAINER" || true
              exit 1
            fi
          ) &
          storage_pid=$!

          if [[ "$TEST_SUITE" == browser ]]; then
            (
              cd ../frontend
              npm ci
              # Build while an unprovisioned runner installs Chrome.
              VITE_API_BASE_URL=/api/v1 npm exec --offline -- vite build &
              browser_build_pid=$!
              browser_failed=0
              if ! google-chrome --version; then
                flock /tmp/garrison-playwright-chrome-install.lock \
                  bash -c 'google-chrome --version || npx playwright install chrome' || browser_failed=1
              fi
              wait "$browser_build_pid" || browser_failed=1
              exit "$browser_failed"
            ) &
            browser_pid=$!
          fi

          failed=0
          if ! wait "$backend_pid"; then
            echo "::error::Backend dependency installation or database migration failed."
            failed=1
          fi
          if ! wait "$storage_pid"; then
            echo "::error::The test S3 endpoint did not start."
            failed=1
          fi
          if [[ "$TEST_SUITE" == browser ]] && ! wait "$browser_pid"; then
            echo "::error::Browser dependency setup or frontend build failed."
            failed=1
          fi
          exit "$failed"
      - name: Pytest
        if: matrix.suite == 'backend'
        env:
          PYTEST_SHARD: ${{ matrix.shard }}
        run: pytest -q -rs --durations=10 --garrison-shard "$PYTEST_SHARD" --junitxml="$RUNNER_TEMP/test-report.xml"
      - name: Browser regressions
        if: matrix.suite == 'browser'
        working-directory: frontend
        env:
          BROWSER_SHARD: ${{ matrix.shard }}
          BROWSER_TEST_PREBUILT: "true"
        run: |
          # Run 43902036278 measured 180s/525s of Chrome test time.
          # The list moves individual HR tests. Its complement covers new tests.
          # One browser worker per isolated self-hosted runner avoids oversubscribing the host.
          case "$BROWSER_SHARD" in
            1) selection=--test-list ;;
            2) selection=--test-list-invert ;;
            *) exit 2 ;;
          esac
          PLAYWRIGHT_JUNIT_OUTPUT_FILE="$RUNNER_TEMP/test-report.xml" \
            npm run test:browser -- --fully-parallel --workers=1 --reporter=list,junit "$selection" e2e/ci-shard-1.txt
      - name: Remove the test S3 container
        if: always()
        run: |
          if docker container inspect "$CI_TEST_S3_CONTAINER" >/dev/null 2>&1; then
            docker container rm --force "$CI_TEST_S3_CONTAINER" >/dev/null
          fi
      - name: Upload shard test report
        if: "!cancelled() && github.event_name == 'push'"
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.run_attempt }}-${{ matrix.suite }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-report.xml
          if-no-files-found: ${{ job.status == 'failure' && 'warn' || 'error' }}
