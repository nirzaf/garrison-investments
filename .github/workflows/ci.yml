name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static:
    name: Backend lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy .
      - name: OpenAPI contract is current
        run: python scripts/export_openapi.py --check

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Generated API types are current
        run: npm run api:types:check
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build

  compose-validate:
    name: Compose files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare example service environment files
        run: |
          cp .env.example .env
          cp .env.example .env.staging
      - name: Validate production compose file
        run: docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet
      - name: Validate staging compose file
        run: docker compose --env-file .env.example -f docker-compose.staging.yml config --quiet

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: garrison
          POSTGRES_PASSWORD: garrison_dev_password
          POSTGRES_DB: garrison_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      s3:
        image: motoserver/moto:5.2.2@sha256:d8ae5edc2bf080e7e4c13f9bd4b29b53ac3b4427e92956318db3dbe23ec43eb7
        ports:
          - 9000:5000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Wait for the test S3 endpoint
        run: curl --fail --silent --show-error --retry 15 --retry-connrefused http://127.0.0.1:9000/ -o /dev/null
      # The suite has no schema-creating fixture, so migrations must run first.
      - name: Apply migrations
        run: alembic upgrade head
      - name: Pytest
        run: pytest -q -rs
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Migrate the isolated browser test database
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://garrison:garrison_dev_password@127.0.0.1:5432/garrison_browser_test
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" createdb -U garrison garrison_browser_test
          alembic upgrade head
      - name: Browser regressions
        working-directory: frontend
        run: npm run test:browser
