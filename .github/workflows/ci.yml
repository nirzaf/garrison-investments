name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static:
    name: Backend lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy .
      - name: OpenAPI contract is current
        run: python scripts/export_openapi.py --check

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Generated API types are current
        run: npm run api:types:check
      - name: Vitest
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/frontend.xml"
      - name: Build
        run: npm run build
      - name: Upload Vitest report
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.run_attempt }}-frontend
          path: ${{ runner.temp }}/frontend.xml
          if-no-files-found: error

  compose-validate:
    name: Compose files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare example production environment file
        run: cp .env.example .env
      - name: Validate production compose file
        run: docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet
      - name: Start object storage and initialize the Loki bucket
        run: docker compose --env-file .env.example -f docker-compose.prod.yml run --rm loki_minio_init

  integration-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: backend
            shard: 1
            name: Backend tests (1/2)
            database: garrison_portal
          - suite: backend
            shard: 2
            name: Backend tests (2/2)
            database: garrison_portal
          - suite: browser
            shard: 1
            name: Browser regressions (1/2)
            database: garrison_browser_test
          - suite: browser
            shard: 2
            name: Browser regressions (2/2)
            database: garrison_browser_test
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: garrison
          POSTGRES_PASSWORD: garrison_dev_password
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U garrison -d ${{ matrix.database }}"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        if: matrix.suite == 'browser'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare test dependencies and storage
        shell: bash
        env:
          TEST_SUITE: ${{ matrix.suite }}
          TEST_S3_IMAGE: motoserver/moto:5.2.2@sha256:d8ae5edc2bf080e7e4c13f9bd4b29b53ac3b4427e92956318db3dbe23ec43eb7
          MIGRATION_DATABASE_URL: postgresql+asyncpg://garrison:garrison_dev_password@127.0.0.1:5432/${{ matrix.database }}
        run: |
          set -euo pipefail

          (
            pip install -r requirements.txt
            # Both suites require an explicitly migrated database.
            APP_ENV=test DATABASE_URL="$MIGRATION_DATABASE_URL" alembic upgrade head
          ) &
          backend_pid=$!

          (
            # Retry the pinned image pull without retrying container creation.
            if ! docker image inspect "$TEST_S3_IMAGE" >/dev/null 2>&1; then
              for attempt in 1 2 3; do
                if timeout 40s docker pull "$TEST_S3_IMAGE" >/dev/null; then
                  break
                fi
                if [[ "$attempt" == 3 ]]; then
                  exit 1
                fi
                sleep "$attempt"
              done
            fi
            docker run --pull never --detach --name garrison-ci-s3 --publish 127.0.0.1:9000:5000 "$TEST_S3_IMAGE" >/dev/null
            # The Docker port proxy can reset a connection before Moto starts listening.
            curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 \
              --retry-max-time 25 --max-time 5 http://127.0.0.1:9000/ -o /dev/null
          ) &
          storage_pid=$!

          if [[ "$TEST_SUITE" == browser ]]; then
            (
              cd ../frontend
              npm ci
              # Downloads and system packages are independent. Wait for both before testing.
              npx playwright install-deps chromium &
              system_deps_pid=$!
              # Build the same bundle that Playwright will serve while Chromium is provisioned.
              VITE_API_BASE_URL=/api/v1 npm exec --offline -- vite build &
              browser_build_pid=$!
              browser_failed=0
              npx playwright install --only-shell chromium || browser_failed=1
              wait "$system_deps_pid" || browser_failed=1
              wait "$browser_build_pid" || browser_failed=1
              exit "$browser_failed"
            ) &
            browser_pid=$!
          fi

          failed=0
          if ! wait "$backend_pid"; then
            echo "::error::Backend dependency installation or database migration failed."
            failed=1
          fi
          if ! wait "$storage_pid"; then
            echo "::error::The test S3 endpoint did not start."
            failed=1
          fi
          if [[ "$TEST_SUITE" == browser ]] && ! wait "$browser_pid"; then
            echo "::error::Browser dependency setup or frontend build failed."
            failed=1
          fi
          exit "$failed"
      - name: Pytest
        if: matrix.suite == 'backend'
        env:
          PYTEST_SHARD: ${{ matrix.shard }}
        run: pytest -q -rs --durations=10 --garrison-shard "$PYTEST_SHARD" --junitxml="$RUNNER_TEMP/test-report.xml"
      - name: Browser regressions
        if: matrix.suite == 'browser'
        working-directory: frontend
        env:
          BROWSER_SHARD: ${{ matrix.shard }}
          BROWSER_TEST_PREBUILT: "true"
        run: |
          # Balance by measured test time. The complement also picks up new test files.
          # Run 43528889335 measured 205.96s on shard 1 and 106.06s on shard 2.
          # Moving finance-workflows (27.13s) and project-setup (20.67s) to shard 2
          # projects 158.16s and 153.86s of case time, respectively; verify job time.
          group='/(media-documents|offline-isolation|role-navigation)\.e2e\.ts$'
          case "$BROWSER_SHARD" in
            1) filter="$group" ;;
            2) filter="^(?!.*$group)" ;;
            *) exit 2 ;;
          esac
          PLAYWRIGHT_JUNIT_OUTPUT_FILE="$RUNNER_TEMP/test-report.xml" \
            npm run test:browser -- --fully-parallel --workers=2 --reporter=list,junit "$filter"
      - name: Remove the test S3 container
        if: always()
        run: |
          if docker container inspect garrison-ci-s3 >/dev/null 2>&1; then
            docker container rm --force garrison-ci-s3 >/dev/null
          fi
      - name: Upload shard test report
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ github.run_attempt }}-${{ matrix.suite }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-report.xml
          if-no-files-found: error
