name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: garrison_portal
          POSTGRES_USER: garrison
          POSTGRES_PASSWORD: garrison_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garrison -d garrison_portal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://garrison:garrison_dev_password@localhost:5432/garrison_portal
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: garrison_minio
      MINIO_ROOT_PASSWORD: garrison_minio_password
      MINIO_BUCKET: portal-files
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

      - name: Alembic migrations
        run: alembic upgrade head

      - name: Launch import template validation
        run: python scripts/validate_import_sources.py --check

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Validate Compose config
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build backend frontend
