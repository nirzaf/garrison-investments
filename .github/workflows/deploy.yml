name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pinned_no_backup_093:
        description: Use the one-use host permit for the approved pinned 093 release
        type: boolean
        default: false
      forward_only_093_to_097:
        description: One-time owner-confirmed forward-only maintenance (not enrolled)
        type: boolean
        default: false
      incident_replacement:
        description: One-time replacement with the fixed green 65308a2 release for the open forward097 incident
        type: boolean
        default: false
      verify_forward097:
        description: Install the CI-tested root verifier and check the existing forward097 receipt without deploying
        type: boolean
        default: false
      ci_run_id:
        description: Successful CI run for the selected release candidate
        type: string
        required: true

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: garrison-portal-production
  cancel-in-progress: false

jobs:
  production:
    name: Deploy to Hostinger
    if: >-
      github.repository == 'nirzaf/garrison-investments' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: [self-hosted, linux, x64, garrison-production]
    timeout-minutes: 30
    environment:
      name: Production
      url: https://portal.garrisons.lk
    steps:
      - name: Check out the exact production candidate
        if: github.event_name == 'workflow_dispatch' && inputs.verify_forward097
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install tested forward097 verifier and verify existing receipt
        if: github.event_name == 'workflow_dispatch' && inputs.verify_forward097
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_REPOSITORY" == nirzaf/garrison-investments &&
             "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Incident verification requires a manual run from main and a CI run ID.' >&2
            exit 1
          }
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          run_id = os.environ["CI_RUN_ID"]
          token = os.environ["GH_TOKEN"]

          def get(path: str) -> dict:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  value = json.load(response)
              if not isinstance(value, dict):
                  raise SystemExit("GitHub returned an invalid response.")
              return value

          run = get(f"actions/runs/{run_id}")
          if not (
              run.get("path") == ".github/workflows/ci.yml"
              and run.get("event") == "push"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == sha
              and (run.get("head_repository") or {}).get("full_name") == repository
          ):
              sys.exit("The exact main SHA does not have a successful CI push.")

          jobs = get(f"actions/runs/{run_id}/jobs?per_page=100").get("jobs")
          required = {
              "Backend lint and types",
              "Frontend lint, types, tests and build",
              "Compose files are valid",
              "Backend tests (1/2)",
              "Backend tests (2/2)",
              "Browser regressions (1/2)",
              "Browser regressions (2/2)",
          }
          if not isinstance(jobs, list) or len(jobs) != 7 or {
              job.get("name") for job in jobs if isinstance(job, dict)
          } != required or any(
              job.get("status") != "completed" or job.get("conclusion") != "success"
              for job in jobs if isinstance(job, dict)
          ):
              sys.exit("The exact CI run is missing a successful required job.")

          main = get("git/ref/heads/main").get("object", {}).get("sha")
          if main != sha:
              sys.exit("The verified candidate is no longer the tip of main.")
          print(f"Verified seven required CI jobs for {sha} (run {run_id}).")
          PY

          sudo -n env \
            GARRISON_SOURCE_SHA="$GITHUB_SHA" \
            GARRISON_CI_RUN_ID="$CI_RUN_ID" \
            GARRISON_WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
            GARRISON_WORKFLOW_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GARRISON_WORKSPACE="$GITHUB_WORKSPACE" \
            /usr/bin/bash -s <<'ROOT'
          set -euo pipefail
          umask 077
          [[ "$EUID" == 0 && "$GARRISON_SOURCE_SHA" =~ ^[a-f0-9]{40}$ &&
             "$GARRISON_CI_RUN_ID" =~ ^[1-9][0-9]*$ &&
             "$GARRISON_WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ &&
             "$GARRISON_WORKFLOW_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || exit 1

          base=/opt/garrison-portal
          state="$base/deploy"
          recovery="$base/recovery"
          helper=/usr/local/lib/garrison-release/forward097_reconcile.py
          entrypoint=/usr/local/sbin/garrison-deploy
          for protected_dir in /opt "$base" "$state" "$recovery" /usr/local \
                              /usr/local/lib /usr/local/lib/garrison-release /usr/local/sbin; do
            [[ -d "$protected_dir" && ! -L "$protected_dir" && -O "$protected_dir" ]] || {
              echo 'A protected production directory is missing or unsafe.' >&2
              exit 1
            }
            protected_mode=$(stat -c '%a' "$protected_dir")
            (( (8#$protected_mode & 0022) == 0 )) || {
              echo 'A protected production directory is group/world writable.' >&2
              exit 1
            }
          done
          [[ -f "$helper" && ! -L "$helper" && -O "$helper" &&
             -f "$entrypoint" && ! -L "$entrypoint" && -O "$entrypoint" ]] || {
            echo 'Protected production deployment paths are missing or unsafe.' >&2
            exit 1
          }

          lock="$state/deploy.lock"
          if [[ -e "$lock" || -L "$lock" ]]; then
            [[ -f "$lock" && ! -L "$lock" && -O "$lock" ]] || {
              echo 'Production deployment lock file is unsafe.' >&2
              exit 1
            }
            lock_mode=$(stat -c '%a' "$lock")
            (( (8#$lock_mode & 0022) == 0 )) || {
              echo 'Production deployment lock file is group/world writable.' >&2
              exit 1
            }
          fi
          exec 9>>"$lock"
          flock -w 60 9 || { echo 'Production deployment lock is busy.' >&2; exit 1; }
          marker="$state/forward097.attempt"
          [[ -f "$marker" && ! -L "$marker" &&
             "$(sha256sum "$marker" | cut -d' ' -f1)" == \
             ab32230bb12aff52ee0e01b730c8a482ff938f278722a37b88619124f61d5285 ]] || {
            echo 'The original forward097 attempt marker is missing or changed.' >&2
            exit 1
          }

          old_helper_sha=3b439ef1b870307f17a1f9b622e3b78639eccb4af44c25468013341e88477403
          old_entrypoint_sha=39306d59fd9e8c23d216c8fccf38b79085fcbea2a02f27a035e57a18d0d404da
          new_helper_sha=32cc7de95a8c97d10684ad1106237dd260b55d32a84e8177e1c68ccd36ac5aed
          new_entrypoint_sha=6aefbfc7d6b32f01f7e0f5ff57ab59c65cd65c0c684165b48899f4ff8c035f6d
          [[ "$(sha256sum "$helper" | cut -d' ' -f1)" == "$old_helper_sha" &&
             "$(sha256sum "$entrypoint" | cut -d' ' -f1)" == "$old_entrypoint_sha" ]] || {
            echo 'Installed deployment tools differ from the reviewed predecessor.' >&2
            exit 1
          }
          python3 "$helper" check --lock-fd 9

          source_helper="$GARRISON_WORKSPACE/deploy/forward097_reconcile.py"
          source_entrypoint="$GARRISON_WORKSPACE/deploy/hostinger-release.sh"
          [[ -f "$source_helper" && ! -L "$source_helper" &&
             -f "$source_entrypoint" && ! -L "$source_entrypoint" &&
             "$(sha256sum "$source_helper" | cut -d' ' -f1)" == "$new_helper_sha" &&
             "$(sha256sum "$source_entrypoint" | cut -d' ' -f1)" == "$new_entrypoint_sha" ]] || {
            echo 'Checked out tool bytes differ from the CI-tested release.' >&2
            exit 1
          }

          installed_at=$(date -u +%Y%m%dT%H%M%SZ)
          snapshot="$recovery/forward097-tools-pre-${GARRISON_SOURCE_SHA:0:7}-${installed_at}"
          [[ ! -e "$snapshot" && ! -L "$snapshot" ]] || {
            echo 'The predecessor snapshot path already exists.' >&2
            exit 1
          }
          install -d -o root -g root -m 0700 "$snapshot"
          export GARRISON_SNAPSHOT="$snapshot"
          install -o root -g root -m 0750 "$entrypoint" "$snapshot/garrison-deploy"
          install -o root -g root -m 0750 "$helper" "$snapshot/forward097_reconcile.py"
          old_entrypoint_backup="$snapshot/garrison-deploy"
          old_helper_backup="$snapshot/forward097_reconcile.py"
          new_entrypoint_tmp="$entrypoint.new.${GARRISON_WORKFLOW_RUN_ID}.${GARRISON_WORKFLOW_ATTEMPT}"
          new_helper_tmp="$helper.new.${GARRISON_WORKFLOW_RUN_ID}.${GARRISON_WORKFLOW_ATTEMPT}"
          record="$recovery/forward097-tools-install-${GARRISON_WORKFLOW_RUN_ID}-${GARRISON_WORKFLOW_ATTEMPT}.json"
          [[ ! -e "$new_entrypoint_tmp" && ! -L "$new_entrypoint_tmp" &&
             ! -e "$new_helper_tmp" && ! -L "$new_helper_tmp" &&
             ! -e "$record" && ! -L "$record" ]] || {
            echo 'A root-tool staging or receipt path already exists.' >&2
            exit 1
          }
          install -o root -g root -m 0750 "$source_helper" "$new_helper_tmp"
          install -o root -g root -m 0750 "$source_entrypoint" "$new_entrypoint_tmp"
          if [[ "$(sha256sum "$new_helper_tmp" | cut -d' ' -f1)" != "$new_helper_sha" ||
                "$(sha256sum "$new_entrypoint_tmp" | cut -d' ' -f1)" != "$new_entrypoint_sha" ]]; then
            rm -f -- "$new_helper_tmp" "$new_entrypoint_tmp"
            echo 'Installed temporary bytes failed their pinned checksum.' >&2
            exit 1
          fi

          tool_update_started=0
          restore_predecessor_tools() {
            result=$?
            trap - EXIT
            if [[ "$tool_update_started" == 1 ]]; then
              install -o root -g root -m 0750 "$old_helper_backup" "$helper" || result=1
              install -o root -g root -m 0750 "$old_entrypoint_backup" "$entrypoint" || result=1
              if [[ "$result" != 0 ]]; then
                echo 'Automatic root-tool rollback failed; keep CD disabled and inspect the preserved snapshot.' >&2
              fi
            fi
            exit "$result"
          }
          trap restore_predecessor_tools EXIT
          tool_update_started=1
          mv -T -- "$new_helper_tmp" "$helper"
          mv -T -- "$new_entrypoint_tmp" "$entrypoint"
          if ! python3 "$helper" check --lock-fd 9 || ! python3 "$helper" verify --lock-fd 9; then
            echo 'Verification failed; automatic rollback will restore the previous root tools.' >&2
            exit 1
          fi

          record_tmp="$record.tmp"
          python3 - "$record_tmp" "$record" <<'PY'
          import json
          import os
          import pathlib
          import stat
          import sys

          temporary = pathlib.Path(sys.argv[1])
          final = pathlib.Path(sys.argv[2])
          record = {
              "operation": "install_and_verify_forward097_reconciliation_tools",
              "source_sha": os.environ["GARRISON_SOURCE_SHA"],
              "ci_run_id": int(os.environ["GARRISON_CI_RUN_ID"]),
              "workflow_run_id": int(os.environ["GARRISON_WORKFLOW_RUN_ID"]),
              "workflow_attempt": int(os.environ["GARRISON_WORKFLOW_ATTEMPT"]),
              "installed_at_utc": __import__("datetime").datetime.now(
                  __import__("datetime").timezone.utc
              ).isoformat(),
              "entrypoint_sha256": "6aefbfc7d6b32f01f7e0f5ff57ab59c65cd65c0c684165b48899f4ff8c035f6d",
              "helper_sha256": "32cc7de95a8c97d10684ad1106237dd260b55d32a84e8177e1c68ccd36ac5aed",
              "predecessor_entrypoint_sha256": "39306d59fd9e8c23d216c8fccf38b79085fcbea2a02f27a035e57a18d0d404da",
              "predecessor_helper_sha256": "3b439ef1b870307f17a1f9b622e3b78639eccb4af44c25468013341e88477403",
              "predecessor_snapshot": os.environ["GARRISON_SNAPSHOT"],
              "verification": "passed",
              "incident_marker_sha256": "ab32230bb12aff52ee0e01b730c8a482ff938f278722a37b88619124f61d5285",
          }
          flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
          fd = os.open(temporary, flags, stat.S_IRUSR | stat.S_IWUSR)
          with os.fdopen(fd, "w", encoding="utf-8") as stream:
              json.dump(record, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
              stream.flush()
              os.fsync(stream.fileno())
          os.link(temporary, final, follow_symlinks=False)
          temporary.unlink()
          directory_fd = os.open(final.parent, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
          try:
              os.fsync(directory_fd)
          finally:
              os.close(directory_fd)
          print(f"Created root-only tool-install receipt: {final.name}")
          PY
          tool_update_started=0
          trap - EXIT
          ROOT
      - name: Deploy the tested commit
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_forward097
        env:
          FORWARD_ONLY_093_TO_097: ${{ inputs.forward_only_093_to_097 }}
          INCIDENT_REPLACEMENT: ${{ inputs.incident_replacement }}
          PINNED_NO_BACKUP_093: ${{ inputs.pinned_no_backup_093 }}
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          release_mode=technical-checks-v1
          if [[ "$INCIDENT_REPLACEMENT" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$CI_RUN_ID" == 44734573582 &&
               "$PINNED_NO_BACKUP_093" != true && "$FORWARD_ONLY_093_TO_097" != true ]] || exit 1
            RELEASE_SHA=65308a2af263cd59e90276b3a771d4ed6ecbf842
            release_mode=incident-replacement
          fi
          if [[ "$FORWARD_ONLY_093_TO_097" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$PINNED_NO_BACKUP_093" != true && "$INCIDENT_REPLACEMENT" != true ]] || exit 1
            release_mode=forward-only-093-to-097
          fi
          if [[ "$PINNED_NO_BACKUP_093" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$CI_RUN_ID" == 44163196512 && "$FORWARD_ONLY_093_TO_097" != true && "$INCIDENT_REPLACEMENT" != true ]] || exit 1
            RELEASE_SHA=0d581001bd294f79a47021c7e30f75a1bf291d2a
            release_mode=pinned-no-backup-093
          fi
          printf '%s\n' "$GH_TOKEN" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" |
            sudo -n /usr/local/sbin/garrison-deploy "$CI_RUN_ID" "$RELEASE_SHA" rollback-v2 "$release_mode"
