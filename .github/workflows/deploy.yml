name: Deploy

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref_name }}-${{ inputs.target || 'branch' }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging
    if: github.ref_name == 'develop' || inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGING_APP_PATH }}"
            git fetch origin develop
            git checkout develop
            git pull --ff-only origin develop
            cp .env.staging .env
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head
            curl --fail --silent --show-error http://localhost/health

  deploy-production:
    name: Deploy production
    if: github.ref_name == 'main' || inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.PRODUCTION_APP_PATH }}"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            cp .env.production .env
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head
            curl --fail --silent --show-error http://localhost/health
