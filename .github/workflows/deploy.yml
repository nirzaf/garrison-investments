name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pinned_no_backup_093:
        description: Use the one-use host permit for the approved pinned 093 release
        type: boolean
        default: false
      forward_only_093_to_097:
        description: One-time owner-confirmed forward-only maintenance (not enrolled)
        type: boolean
        default: false
      ci_run_id:
        description: Successful CI run for the current main commit
        type: string
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: garrison-portal-production
  cancel-in-progress: false

jobs:
  production:
    name: Deploy to Hostinger
    if: >-
      github.repository == 'nirzaf/garrison-investments' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: [self-hosted, linux, x64, garrison-production]
    timeout-minutes: 30
    environment:
      name: Production
      url: https://portal.garrisons.lk
    steps:
      - name: Deploy the tested commit
        env:
          FORWARD_ONLY_093_TO_097: ${{ inputs.forward_only_093_to_097 }}
          PINNED_NO_BACKUP_093: ${{ inputs.pinned_no_backup_093 }}
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          release_mode=technical-checks-v1
          if [[ "$FORWARD_ONLY_093_TO_097" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$PINNED_NO_BACKUP_093" != true ]] || exit 1
            release_mode=forward-only-093-to-097
          fi
          if [[ "$PINNED_NO_BACKUP_093" == true ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$CI_RUN_ID" == 44163196512 ]] || exit 1
            RELEASE_SHA=0d581001bd294f79a47021c7e30f75a1bf291d2a
            release_mode=pinned-no-backup-093
          fi
          printf '%s\n' "$GH_TOKEN" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" |
            sudo -n /usr/local/sbin/garrison-deploy "$CI_RUN_ID" "$RELEASE_SHA" rollback-v2 "$release_mode"
