x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: ./frontend
    command: npm run preview -- --host 0.0.0.0 --port 3000
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    expose:
      - "3000"
    volumes:
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    logging: *default-logging

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "127.0.0.1:3310:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    logging: *default-logging

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --no-access-log
    env_file:
      - .env.staging
    expose:
      - "8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - minio
    logging: *default-logging

  celery_worker:
    build:
      context: ./backend
    command: celery -A app.tasks.celery_app.celery_app worker -Q email,image,report,backup,maintenance --concurrency=4 --loglevel=INFO
    env_file:
      - .env.staging
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - postgres
    logging: *default-logging

  celery_beat:
    build:
      context: ./backend
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=INFO
    env_file:
      - .env.staging
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    logging: *default-logging

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ${OBJECT_STORAGE_IMAGE:-pgsty/silo:RELEASE.2026-11-09T00-00-00Z@sha256:08ce1505b5eacefbad1ca07159b242b9ce045a11c2817e3bc257b25f77bbc02d}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana_db_init:
    image: postgres:18.6-alpine
    restart: "no"
    env_file:
      - .env.staging
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ./observability/postgres/init-grafana-db.sh:/init/init-grafana-db.sh:ro
    command: ["/bin/sh", "/init/init-grafana-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  loki_minio_init:
    image: ${OBJECT_STORAGE_CLIENT_IMAGE:-pgsty/mc:RELEASE.2026-11-09T00-00-00Z@sha256:82b1c51de77aa7687d4d2c1a2b388dc7752528a64377c48a3e1271dcac39dbcf}
    restart: "no"
    env_file:
      - .env.staging
    environment:
      MC_CONFIG_DIR: /tmp/mc
    volumes:
      - ./observability/minio/loki-policy.json:/config/loki-policy.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing local/loki
        mc admin user info local "$${LOKI_MINIO_ACCESS_KEY}" >/dev/null 2>&1 ||
          mc admin user add local "$${LOKI_MINIO_ACCESS_KEY}" "$${LOKI_MINIO_SECRET_KEY}"
        mc admin policy info local loki-writer >/dev/null 2>&1 ||
          mc admin policy create local loki-writer /config/loki-policy.json
        mc admin policy attach local loki-writer --user "$${LOKI_MINIO_ACCESS_KEY}"
    depends_on:
      minio:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  loki:
    image: grafana/loki:3.7.4@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc
    restart: unless-stopped
    env_file:
      - .env.staging
    command: ["-config.file=/etc/loki/config.yml", "-config.expand-env=true"]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - lokidata:/loki
    depends_on:
      loki_minio_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    restart: unless-stopped
    user: "473:473"
    group_add:
      - ${DOCKER_SOCKET_GID:-999}
    environment:
      APP_ENV: ${APP_ENV:-staging}
      COMPOSE_PROJECT_NAME: garrisonstg
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/alloy", "--version"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.1@sha256:7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "false"
      GF_SECURITY_DISABLE_IP_ADDRESS_LOGIN_PROTECTION: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-true}
      GF_SMTP_HOST: ${SMTP_HOST}:${SMTP_PORT}
      GF_SMTP_USER: ${SMTP_USERNAME}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM_EMAIL}
      GF_SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      GRAFANA_ALERT_EMAILS: ${EXCEPTION_EMAIL_RECIPIENTS}
    ports:
      - "127.0.0.1:3311:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${GRAFANA_CONTACT_POINT_FILE:-./observability/grafana/provisioning/alerting/contact-point.yml}:/etc/grafana/provisioning/alerting/contact-point.yml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      grafana_db_init:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging

volumes:
  pgdata:
    name: garrisonstg-pgdata
  redisdata:
    name: garrisonstg-redisdata
  miniodata:
    name: garrisonstg-miniodata
  frontend_node_modules:
  grafanadata:
    name: garrisonstg-grafanadata
  lokidata:
    name: garrisonstg-lokidata
  alloydata:
    name: garrisonstg-alloydata
