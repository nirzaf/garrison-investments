services:
  frontend:
    build:
      context: ./frontend
    command: npm run preview -- --host 0.0.0.0 --port 3000
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    expose:
      - "3000"
    volumes:
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "127.0.0.1:3310:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    env_file:
      - .env.staging
    expose:
      - "8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - minio

  celery_worker:
    build:
      context: ./backend
    command: celery -A app.tasks.celery_app.celery_app worker -Q email,image,report,backup,maintenance --concurrency=4 --loglevel=INFO
    env_file:
      - .env.staging
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - postgres

  celery_beat:
    build:
      context: ./backend
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=INFO
    env_file:
      - .env.staging
    volumes:
      - ./backend:/app
    depends_on:
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: garrisonstg-pgdata
  redisdata:
    name: garrisonstg-redisdata
  miniodata:
    name: garrisonstg-miniodata
  frontend_node_modules:
