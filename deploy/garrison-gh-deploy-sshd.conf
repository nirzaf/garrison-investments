# Install in /etc/ssh/sshd_config.d/ and validate with sshd -t before reload.
Match User garrison-gh-deploy
    AuthenticationMethods publickey
    AuthorizedKeysFile /etc/ssh/garrison-deploy/authorized_keys
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    DisableForwarding yes
    PermitTunnel no
    PermitUserRC no
    ForceCommand /usr/local/lib/garrison-release/garrison-gh-force-command

Match all
